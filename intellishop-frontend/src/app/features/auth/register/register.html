   <div class="auth-page">
    <div class="auth-card shadow">
  
      <!-- HEADER -->
      <div class="auth-header text-center mb-4">
        <div class="brand-title">IntelliShop</div>
        <h2 class="auth-title">Inscription</h2>
        <p class="auth-subtitle">
          Créez un compte pour commencer vos achats.
        </p>
      </div>
  
      <!-- FORM -->
      <form (ngSubmit)="register()">
  
        <div class="mb-3">
          <label class="form-label">Nom</label>
          <input
            type="text"
            class="form-control auth-input"
            placeholder="ex: Denis"
            [(ngModel)]="nom"
            name="nom"
            required
          />
        </div>
  
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control auth-input"
            placeholder="ex: denis@test.com"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>
  
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input
            type="password"
            class="form-control auth-input"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>
  
        <button type="submit" class="btn btn-primary w-100 auth-btn">
          Créer un compte
        </button>
  
        <div class="text-center mt-3">
          <span class="text-muted">Déjà un compte ?</span>
          <a routerLink="/login" class="auth-link ms-1">Se connecter</a>
        </div>
  
        @if(error){
          <div class="alert alert-danger mt-3 mb-0">
            {{ error }}
          </div>
        }
      </form>
    </div>
  </div>
